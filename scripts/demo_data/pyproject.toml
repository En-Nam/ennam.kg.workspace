[project]
name = "pharmacy-demo-gen"
version = "0.1.0"
description = "Deterministic generator for the 12-month pharmacy_demo dataset"
requires-python = ">=3.12"
dependencies = ["openpyxl==3.1.5"]

[dependency-groups]
dev = ["pytest==8.3.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
