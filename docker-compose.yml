# Ennam Knowledge Graph Platform — Unified Local Development
#
# Starts all services needed for local testing:
#   docker compose up -d              # Start everything
#   docker compose up -d --build      # Rebuild and start
#   docker compose logs -f            # Follow all logs
#   docker compose logs -f kg-server  # Follow specific service
#   docker compose ps                 # Check status
#   docker compose down               # Stop all
#   docker compose down -v            # Stop and remove data
#
# Services:
#   postgres    — PostgreSQL 16        (port 5432)
#   redis       — Redis 7              (port 6379)
#   kg-server   — Go API server        (port 8080)
#   indexer     — Python indexing HTTP  (port 8081)
#   worker      — Python queue worker  (no port)
#   dashboard   — NextJS web UI        (port 3500)

services:
  # ===========================================================================
  # Infrastructure
  # ===========================================================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ennam-kg-postgres
    restart: unless-stopped
    ports:
      - "${KG_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${KG_DB_NAME:-ennam_kg}
      POSTGRES_USER: ${KG_DB_USER:-ennam_kg}
      POSTGRES_PASSWORD: ${KG_DB_PASSWORD:-ennam_kg_dev}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KG_DB_USER:-ennam_kg} -d ${KG_DB_NAME:-ennam_kg}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ennam-kg

  redis:
    image: redis:7-alpine
    container_name: ennam-kg-redis
    restart: unless-stopped
    ports:
      - "${KG_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ennam-kg

  # ===========================================================================
  # Go API Server
  # ===========================================================================

  kg-server:
    build:
      context: ./ennam.kg.go
      dockerfile: deploy/docker/Dockerfile
      target: development
    container_name: ennam-kg-server
    restart: unless-stopped
    ports:
      - "${KG_SERVER_PORT:-8080}:8080"
    environment:
      # Database
      KG_DB_HOST: postgres
      KG_DB_PORT: 5432
      KG_DB_NAME: ${KG_DB_NAME:-ennam_kg}
      KG_DB_USER: ${KG_DB_USER:-ennam_kg}
      KG_DB_PASSWORD: ${KG_DB_PASSWORD:-ennam_kg_dev}
      KG_DB_SSLMODE: disable
      # Server
      KG_SERVER_PORT: 8080
      KG_LOG_LEVEL: ${KG_LOG_LEVEL:-debug}
      KG_CONFIG_PATH: /app/config/config.yaml
      # Auth
      KG_API_KEY: ${KG_API_KEY:-ennam_kg_dev_000000000000000000000000}
      KG_AUTH_NOOP: ${KG_AUTH_NOOP:-false}
      # Supabase login integration
      KG_SUPABASE_URL: ${KG_SUPABASE_URL:-https://nicrcubktflnwdkhotut.supabase.co}
      KG_SUPABASE_ADMIN_EMAILS: ${KG_SUPABASE_ADMIN_EMAILS:-admin@ennam.vn,dragoon@exnodes.vn}
      # Phase 2: Encryption key for data source credentials + AI provider API keys
      KG_ENCRYPTION_KEY: ${KG_ENCRYPTION_KEY:-}
      # Queue
      KG_QUEUE_PROVIDER: redis
      KG_REDIS_URL: redis://redis:6379/0
      # Python indexer URL (for SSE proxy /api/v1/ai-query/stream → agentic loop)
      KG_PYTHON_URL: http://indexer:8081
      KG_UPLOAD_DIR: /app/data/uploads
    volumes:
      - ./ennam.kg.go:/app
      - ennam_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ennam-kg

  # ===========================================================================
  # Python Indexing Service (HTTP API)
  # ===========================================================================

  indexer:
    build:
      context: ./ennam.kg.python
      dockerfile: Dockerfile
    container_name: ennam-kg-indexer
    restart: unless-stopped
    ports:
      - "${KG_INDEXER_PORT:-8081}:8081"
    environment:
      GO_API_URL: http://kg-server:8080
      GO_API_KEY: ${KG_API_KEY:-ennam_kg_dev_000000000000000000000000}
      REDIS_URL: redis://redis:6379/0
      REDIS_QUEUE_NAME: ennam-kg:indexing
      REDIS_AI_QUEUE_NAME: ennam-kg:ai-tasks
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_LEVEL: ${KG_LOG_LEVEL:-DEBUG}
      NL_QUERY_TIMEOUT: ${NL_QUERY_TIMEOUT:-30}
      BENCHMARK_CONCURRENCY: ${BENCHMARK_CONCURRENCY:-5}
      # Shared with Go API — Python decrypts X-DB-DSN header for direct DB access.
      # Python Settings expects "ENCRYPTION_KEY" (no prefix), Go expects "KG_ENCRYPTION_KEY".
      ENCRYPTION_KEY: ${KG_ENCRYPTION_KEY:-}
      EMBEDDING_SERVICE_URL: http://127.0.0.1:8081
      HF_HOME: /tmp/huggingface
      TRANSFORMERS_CACHE: /tmp/huggingface
    volumes:
      - ./ennam.kg.go:/repos/ennam-kg-go:ro
      - ./ennam.kg.next:/repos/ennam-kg-next:ro
      - ./ennam.kg.python:/repos/ennam-kg-python:ro
      - ./ennam.kg.requirements:/repos/ennam-kg-requirements:ro
    depends_on:
      kg-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8081/healthz'')" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ennam-kg

  # ===========================================================================
  # Python Queue Worker (background consumer)
  # ===========================================================================

  worker:
    build:
      context: ./ennam.kg.python
      dockerfile: Dockerfile
    container_name: ennam-kg-worker
    restart: unless-stopped
    command: ["python", "-m", "ennam_kg.worker"]
    environment:
      GO_API_URL: http://kg-server:8080
      GO_API_KEY: ${KG_API_KEY:-ennam_kg_dev_000000000000000000000000}
      REDIS_URL: redis://redis:6379/0
      REDIS_QUEUE_NAME: ennam-kg:indexing
      REDIS_AI_QUEUE_NAME: ennam-kg:ai-tasks
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_LEVEL: ${KG_LOG_LEVEL:-DEBUG}
      NL_QUERY_TIMEOUT: ${NL_QUERY_TIMEOUT:-30}
      BENCHMARK_CONCURRENCY: ${BENCHMARK_CONCURRENCY:-5}
      REDIS_KG_GENERATION_QUEUE: ennam:kg_generation
      KG_UPLOAD_DIR: /app/data/uploads
      EMBEDDING_SERVICE_URL: http://127.0.0.1:8081
      HF_HOME: /tmp/huggingface
      TRANSFORMERS_CACHE: /tmp/huggingface
      # Models live in the hf_cache named volume (survives rebuilds — the real fix).
      # Online HEAD lookups stay enabled: sentence-transformers resolves the repo
      # online then reads the cached snapshot (+ .no_exist markers). Full offline
      # (HF_HUB_OFFLINE=1) breaks bare-name resolution, so it is NOT set.
      EXTRACTION_LLM_URL: ${EXTRACTION_LLM_URL:-}
      EXTRACTION_LLM_KEY: ${EXTRACTION_LLM_KEY:-}
      EXTRACTION_LLM_MODEL: ${EXTRACTION_LLM_MODEL:-deepseek-v4-pro}
      # BA-031 Phase C C.2: batch LLM verify (5-10x fewer calls). Default off (=1);
      # enabled here to speed Pass-2 resolution on large docs.
      RESOLUTION_VERIFY_BATCH_SIZE: ${RESOLUTION_VERIFY_BATCH_SIZE:-6}
    volumes:
      - ./ennam.kg.go:/repos/ennam-kg-go:ro
      - ./ennam.kg.next:/repos/ennam-kg-next:ro
      - ./ennam.kg.python:/repos/ennam-kg-python:ro
      - ./ennam.kg.requirements:/repos/ennam-kg-requirements:ro
      - ennam_uploads:/app/data/uploads
      - hf_cache:/tmp/huggingface
    depends_on:
      kg-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ennam-kg

  # ===========================================================================
  # NextJS Dashboard
  # ===========================================================================

  dashboard:
    build:
      context: ./ennam.kg.next
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://nicrcubktflnwdkhotut.supabase.co}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-sb_publishable_TT5H3qIx5dC8UPBTsbvn-A_JCs5zucU}
    container_name: ennam-kg-dashboard
    restart: unless-stopped
    ports:
      - "${KG_DASHBOARD_PORT:-3500}:3500"
    environment:
      GO_API_URL: http://kg-server:8080
      KG_API_KEY: ${KG_API_KEY:-ennam_kg_dev_000000000000000000000000}
      SESSION_SECRET: ${SESSION_SECRET:-ennam-kg-dev-session-secret-32chars!!}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://nicrcubktflnwdkhotut.supabase.co}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-sb_publishable_TT5H3qIx5dC8UPBTsbvn-A_JCs5zucU}
    depends_on:
      kg-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3500'').then(r=>{process.exit(r.ok||r.status===307?0:1)}).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ennam-kg

  # MCP gateway (kg-bridge) in MULTI-TENANT passthrough mode: each request's
  # Bearer is the caller's own KG API key, forwarded per-request to kg-server,
  # which enforces scope (role + project_members). Hosts one MCP endpoint for
  # many consumers (AAAA/LAAM/agents), each with their own scoped key.
  #
  # Starts with the stack (docker compose up -d). Expose to the tailnet with
  # Tailscale Serve (TLS) or by publishing the port directly.
  kg-bridge:
    build:
      context: ./ennam.kg.go
      dockerfile: deploy/docker/Dockerfile
      target: production
    container_name: ennam-kg-bridge
    restart: unless-stopped
    entrypoint: ["/app/kg-bridge"]
    command: ["serve", "--http", "0.0.0.0:8765"]
    environment:
      KG_MCP_AUTH_PASSTHROUGH: "true"
      KG_SERVER_URL: http://kg-server:8080   # internal docker network — no host port needed
    ports:
      - "${KG_BRIDGE_PORT:-8765}:8765"
    depends_on:
      kg-server:
        condition: service_healthy
    networks:
      - ennam-kg

volumes:
  postgres_data:
    driver: local
  ennam_uploads:
    driver: local
  hf_cache:
    driver: local

networks:
  ennam-kg:
    driver: bridge
