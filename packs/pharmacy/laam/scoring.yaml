# Overrides health_score only (to count PH-* rules); other keys are inherited from retail.
# The merge is shallow, so everything retail sets inside health_score is repeated here
# (incl. RET-VENDOR-* and status_caps) — keep in sync with packs/retail/laam/scoring.yaml.
health_score:
  components:
    sales_margin:    { weight: 30, rules: ["RET-SALES-*", "RET-MARGIN-*", "RET-VENDOR-*", "PH-MARGIN-*"] }
    inventory:       { weight: 25, rules: ["RET-INV-*"] }
    loss_prevention: { weight: 20, rules: ["RET-REF-*", "RET-DISC-*", "RET-VOID-*", "RET-CASH-*", "RET-X-*", "PH-CLAIM-*"] }
    labor:           { weight: 15, rules: ["RET-LABOR-*"] }
  data_quality_weight: 10
  severity_penalty: { critical: 60, high: 40, medium: 20, warning: 20, low: 5 }
  status_bands:
    - { min: 85, label: healthy }
    - { min: 70, label: monitor }
    - { min: 50, label: needs_attention }
    - { min: 0,  label: high_priority }
  status_caps:
    - { component: inventory,       min_severity: critical, max_status: monitor }
    - { component: loss_prevention, min_severity: critical, max_status: monitor }
