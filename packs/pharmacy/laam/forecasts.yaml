# Additive metrics only; margin is derived from these, never forecast as a rate.
forecasts:
  - metric: pharmacy.rx_revenue
    dims: [location_id]
    horizons_days: [7, 30]
    season_length: 7
    max_data_lag_days: 1       # daily series: tolerate one day of ingest lag (as retail sales)
  - metric: pharmacy.rx_cost
    dims: [location_id]
    horizons_days: [7, 30]
    season_length: 7
    max_data_lag_days: 1
